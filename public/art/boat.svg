    <path d="M58 37Q52 58 54 76M43 108Q46 117 45 133M57 149Q59 161 58 172M78 30Q86 43 88 54M91 148Q86 166 89 175M64 187 65 196M75 177Q79 186 77 193" stroke="#f4deb4" stroke-width=".85" opacity=".75"/>
