  <path d="M44 59Q66 49 94 60L98 94Q72 105 42 92Z" fill="#826f51" opacity=".13"/>
  <path d="M44 56Q66 46 92 58L96 90Q71 101 42 88Z" fill="#ede7ce" stroke="#b3b491" stroke-width="1"/>
