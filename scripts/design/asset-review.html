<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pond · 实际模型近景</title><link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e4e6dc;color:#3e5147;font:13px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:fixed;inset:20px 24px auto;display:flex;justify-content:space-between;align-items:center;gap:15px;z-index:1}header div{background:#f5f5ebe8;padding:12px 17px;border-radius:8px}select{background:#f5f5eb;border:1px solid #b9c3b2;border-radius:6px;padding:10px;color:inherit}p{margin:5px 0 0;color:#7a8574;font-size:11px}a{color:inherit}#status{position:fixed;bottom:20px;left:24px;font-size:11px}
  </style>
</head>
<body>
  <header><div>实际模型 · 制作中<p>拖动旋转，滚轮缩放 · <a href="life-review.html">动物近景</a> · <a href="koi-review.html">动物对照</a> · <a href="scene-review.html">日夜实景</a></p></div><div><select aria-label="视角" id="view"><option value="concept">参考视角</option><option value="oblique">斜俯视</option><option value="top">正俯视</option><option value="side">侧面</option><option value="face">人物正面</option><option value="head">头脸近景</option></select> <select aria-label="模型" id="asset"><option value="boat">小舟与乘客</option><option value="character">人物单独</option><option value="boat-legacy">归档小舟 GLB</option><option value="volume-before">体积改造前</option><option value="before">最初版本</option><option value="world">归档岛屿</option><option value="about">树与岛岸</option><option value="github">GitHub 桌面</option><option value="email">木质邮箱</option></select> <select aria-label="显示方式" id="surface"><option value="material">材质</option><option value="gray">灰模</option><option value="wire">线框</option></select></div></header>
  <div id="status">正在读取模型…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { boatMaterial } from '/src/scene/boat-material.ts';
    import { makePondBoat } from '/src/scene/PondBoat.ts';
    import { makeBoatSleeper } from '/src/scene/boat-sleeper.ts';
    import { worldMaterial } from '/src/scene/world-material.ts';
    import { islandScale, islandHeightScale } from '/src/scene/world-layout.ts';
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
    renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.append(renderer.domElement);
    const scene=new THREE.Scene();scene.background=new THREE.Color('#e4e6dc');
    const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,500);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;
    const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);
    scene.add(new THREE.HemisphereLight('#e4f3f5','#6c7654',1.45));
    const light=new THREE.DirectionalLight('#fff1cf',2.6);light.position.set(-5,9,5);light.castShadow=true;
    light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-12;light.shadow.camera.right=12;light.shadow.camera.top=12;light.shadow.camera.bottom=-12;light.shadow.normalBias=.02;scene.add(light);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.ShadowMaterial({color:'#455147',opacity:.14}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
    const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);let root,assetName='boat',fingerprint='',busy=false;
    const originals=new Map(),gray=new THREE.MeshStandardMaterial({color:'#a5b5aa',roughness:.72,side:THREE.DoubleSide}),wire=new THREE.MeshBasicMaterial({color:'#3f6158',wireframe:true});
    function surface(){const mode=document.querySelector('#surface').value;for(const [mesh,material]of originals)mesh.material=mode==='gray'?gray:mode==='wire'?wire:material;render();}
    const snapshotId=new URLSearchParams(location.search).get('snapshot');
    const snapshot=snapshotId==='before'?'modeling-20261104f':snapshotId==='20261104g'?'modeling-20261104g':null;
    const native = name => !snapshot && (name === 'boat' || name === 'character');
    function assetUrl(name) {
      const model = ['about','github','email'].includes(name) ? 'world' : name === 'boat-legacy' ? 'boat' : name;
      if (snapshot) return `/.playwright-mcp/${snapshot}/before/` +
        (name === 'character' ? 'scripts/models/raw/pond-character.glb' : `public/models/pond-${model}.glb`);
      if (name === 'character') return '/scripts/models/raw/pond-character.glb';
      if (name === 'volume-before') return '/.playwright-mcp/quality-start-20261101/pond-boat-before-volume.glb';
      if (name === 'before') return '/.playwright-mcp/quality-start-20261101/pond-boat.glb';
      return model === 'boat' ? '/public/models/pond-boat-web.glb' : `/public/models/pond-${model}.glb`;
    }
    function frame(){
      if(!root)return;
      const box=new THREE.Box3().setFromObject(root),wholeBox=box.clone(),view=document.querySelector('#view').value;
      if(view==='head'&&assetName==='character'){
        const headBox=new THREE.Box3();root.traverse(object=>{if(object.name==='Traveler head'||object.isMesh&&object.name.startsWith('head_'))headBox.expandByObject(object);});
        if(!headBox.isEmpty())box.copy(headBox);
      }
      const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z);
      const directions={concept:[-2.8,1.85,-2.8],oblique:[1.1,2.6,-1.65],top:[0,4,-.001],side:[3,1,-.35],face:[.12,1.9,-2.8],head:[.10,4,-.9]};
      const isIsland=['about','github','email'].includes(assetName);
      const offset=new THREE.Vector3(...(assetName==='world'?[.9,1.25,1.65]:isIsland&&view==='oblique'?[.35,1.8,2.1]:directions[view])).normalize().multiplyScalar(radius*1.95);
      if(assetName==='about'){offset.multiplyScalar(1.12);}
      if(assetName==='github'){center.set(-5,1.1*islandHeightScale,4);offset.multiplyScalar(.70);}
      if(assetName==='email'){center.set(4.9,1.12*islandHeightScale,4.3);offset.multiplyScalar(.60);}
      camera.position.copy(center).add(offset);controls.target.copy(center);floor.position.y=wholeBox.min.y-.04;controls.update();render();
    }
    async function load(name,preserveView=false){
      busy=true;
      const isIsland=['about','github','email'].includes(name);
      let asset;
      try {
        asset = native(name) ? { scene: (name==='boat' ? makePondBoat() : makeBoatSleeper()).root }
          : await loader.loadAsync(assetUrl(name)+'?review='+Date.now());
      } catch(error){document.querySelector('#status').textContent='模型仍在生成，保留上次结果 · '+error.message;busy=false;return;}
      if(root){scene.remove(root);root.traverse(object=>{if(object.isMesh){if(object.isSkinnedMesh)object.skeleton.dispose();if(object.isInstancedMesh)object.dispose();object.geometry.dispose();const original=originals.get(object);for(const material of Array.isArray(original)?original:[original]){material?.map?.dispose();material?.dispose()}}});originals.clear();}
      root=asset.scene;assetName=name;
      if(isIsland)for(const child of [...root.children]){if(child.name!=='island-'+name)root.remove(child);else child.scale.set(islandScale,islandHeightScale,islandScale);}
      let triangles=0,meshes=0;root.traverse(object=>{if(object.isMesh){if(!native(name)){object.castShadow=object.receiveShadow=true;const materialFor=name==='world'||isIsland?worldMaterial:boatMaterial;object.material=Array.isArray(object.material)?object.material.map(materialFor):materialFor(object.material);}originals.set(object,object.material);triangles+=(object.geometry.index?.count??object.geometry.attributes.position.count)/3*(object.isInstancedMesh?object.count:1);meshes++;}});scene.add(root);if(!preserveView)frame();
      document.querySelector('#asset').value=name;document.querySelector('#status').textContent=(native(name)?'Three.js '+(name==='boat'?'小舟与乘客':'人物'):name==='volume-before'?'体积改造前':name==='before'?'最初版本':isIsland?(name==='about'?'树与岛岸':name==='github'?'GitHub 桌面':'木质邮箱'):'pond-'+name+'.glb')+' · '+triangles.toLocaleString()+' 三角面 / '+meshes+' Mesh · 实际网页材质与日间光强';controls.update();surface();busy=false;document.body.dataset.ready='true';window.pondReview={scene,camera,controls,renderer,root,frame};
    }
    const params=new URLSearchParams(location.search),initialAsset=params.get('asset')||'boat';document.querySelector('#view').value=params.get('view')==='head'&&initialAsset!=='character'?'concept':params.get('view')||'concept';document.querySelector('#surface').value=params.get('surface')||'material';
    function remember(){const url=new URL(location.href);for(const id of ['asset','view','surface'])url.searchParams.set(id,document.querySelector('#'+id).value);history.replaceState(null,'',url);}
    document.querySelector('#view').onchange=async()=>{if(document.querySelector('#view').value==='head'&&assetName!=='character'){fingerprint='';await load('character');}else frame();remember();};
    document.querySelector('#surface').onchange=()=>{surface();remember();};document.querySelector('#asset').onchange=async e=>{fingerprint='';if(e.target.value!=='character'&&document.querySelector('#view').value==='head')document.querySelector('#view').value='concept';await load(e.target.value);remember();};load(initialAsset);
    setInterval(async()=>{if(busy||native(assetName))return;try{const response=await fetch(assetUrl(assetName),{method:'HEAD',cache:'no-store'});if(!response.ok)return;const next=response.headers.get('etag')||response.headers.get('last-modified')||response.headers.get('content-length');if(fingerprint&&next!==fingerprint){await load(assetName,true);}fingerprint=next;}catch{}},2500);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});
  </script>
</body>
</html>
