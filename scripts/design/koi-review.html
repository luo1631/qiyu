<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pond · 锦鲤形体对照</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#cbd9cf;color:#354e43;font:14px system-ui}canvas{display:block}header{position:fixed;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;gap:12px}header>div{background:#f7f3e8ed;padding:15px 20px;border-radius:8px}p{font-size:12px;margin:5px 0 0;color:#718475}button,select{background:transparent;border:1px solid #a9baaa;border-radius:4px;color:inherit;padding:8px;margin-left:8px}.label{position:fixed;bottom:8%;text-align:center;width:40%;font-size:15px}.label small{display:block;font-size:12px;color:#677f70;margin-top:6px}
</style></head><body><header><div>锦鲤 · 实际模型对照<p>同一光照；拖动旋转、滚轮缩放。制作审阅，不进入发布包。</p></div><div><select id="variant" aria-label="花色"><option value="0">黄金</option><option value="1">红白</option><option value="2">橙白</option></select><button id="gray">灰模</button><button id="play">播放游动</button></div></header><div class="label" style="left:8%">早期版本<small>历史造型基线</small></div><div class="label" style="right:8%">当前制作版本<small>实际运行几何与材质</small></div><script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {makeAquaticModels} from '/src/scene/PondCreatures.ts';
import {makeAquaticModels as makeBefore} from '/.playwright-mcp/PondCreatures-flow-before.ts';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#cbd9cf');scene.add(new T.HemisphereLight('#e4f3f5','#6c7654',1.45));const sun=new T.DirectionalLight('#fff1cf',2.6);sun.position.set(-3,7,4);scene.add(sun);
const camera=new T.PerspectiveCamera(32,innerWidth/2/innerHeight,.01,100);camera.position.set(1.25,1.8,-2.7);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,.04);controls.enableDamping=true;
const animal=new URLSearchParams(location.search).get('animal')||'koi',collections=[makeBefore(),makeAquaticModels()];let variant=0,playing=false,gray=false,time=1.2,last=performance.now();const originals=new Map(),grayMaterial=new T.MeshStandardMaterial({color:'#b1bbb6',roughness:.7,side:T.DoubleSide});
const groups=collections.map(m=>{const group=new T.Group(),models=animal==='frog'?[m.frog]:animal==='turtle'?[m.turtles[0]]:m.koi;models.forEach((k,i)=>{k.root.visible=i===variant;k.root.scale.multiplyScalar(animal==='frog'?1.8:animal==='turtle'?1.2:1.7);group.add(k.root);k.root.traverse(o=>{if(o.isMesh)originals.set(o,o.material)});});scene.add(group);return group;});
const view=new URLSearchParams(location.search).get('view');if(view==='side')camera.position.set(3.4,.95,.1);else if(view==='front')camera.position.set(0,.9,-3.2);if(animal==='frog')controls.target.y=.22;
if(animal!=='koi'){document.querySelector('#variant').hidden=true;document.querySelector('header>div').firstChild.textContent=(animal==='frog'?'青蛙':'乌龟')+' · 实际模型对照';document.querySelector('.label[style*="right"] small').textContent=animal==='frog'?'饱满头身 · 连续眼眶 · 贴合口线':'背峰与薄壳缘 · 颈部和四肢';}
document.querySelector('#variant').onchange=e=>{variant=Number(e.target.value);collections.forEach(m=>m.koi.forEach((k,i)=>k.root.visible=i===variant));};
document.querySelector('#gray').onclick=e=>{gray=!gray;for(const [o,m] of originals)o.material=gray?grayMaterial:m;e.target.textContent=gray?'恢复材质':'灰模'};
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停游动':'播放游动'};
renderer.setAnimationLoop(()=>{const now=performance.now();if(playing)time+=Math.min(.05,(now-last)/1000);last=now;collections.forEach(m=>{if(animal==='koi')m.koi.forEach(k=>k.update({x:0,y:0,z:0,yaw:.08,pitch:0,speed:.22},time));else{const model=animal==='frog'?m.frog:m.turtles[0];if(playing&&model.update)model.update({x:0,y:0,z:0,yaw:0,pitch:0,speed:.22,gait:time*(animal==='frog'?2.6:1.35),mode:'swim',jump:0,padIndex:-1},time);else model.limbs.forEach((l,j)=>l.rotation.y=playing?Math.sin(time*2+j*Math.PI*.67)*.18:0);}});controls.update();renderer.setScissorTest(true);for(let i=0;i<2;i++){groups.forEach((g,n)=>g.visible=n===i);renderer.setViewport(i*innerWidth/2,0,innerWidth/2,innerHeight);renderer.setScissor(i*innerWidth/2,0,innerWidth/2,innerHeight);renderer.render(scene,camera);}renderer.setScissorTest(false);document.body.dataset.ready='true';});
addEventListener('resize',()=>{camera.aspect=innerWidth/2/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
