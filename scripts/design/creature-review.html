<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Pond · 龟蛙形体</title><style>body{margin:0;background:#dce3d8;color:#354e43;font:13px system-ui}canvas{display:block}header{position:fixed;inset:18px 22px auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}header>div,select,a{background:#f7f3e8ee;border:1px solid #bbcab9;padding:9px 13px;border-radius:7px;color:inherit}p{font-size:11px;color:#738074;margin:4px 0 0}#status{position:fixed;bottom:18px;left:22px}</style></head><body><header><div>青蛙与乌龟 · 形体审阅<p>真实网页几何与静态姿势 · 拖动旋转、滚轮缩放</p></div><select id="asset"><option value="frog">青蛙</option><option value="turtle">乌龟</option></select><select id="view"><option value="oblique">斜前方</option><option value="front">正面</option><option value="side">侧面</option><option value="top">俯视</option></select><select id="pose"><option value="rest">静止</option><option value="swim">划水</option><option value="jump">起跳（蛙）</option><option value="ride">爬背（龟）</option></select><select id="surface"><option value="material">材质</option><option value="gray">灰模</option></select><a href="life-review.html">连续动作</a><a href="/">实际池塘</a></header><div id="status"></div><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const params=new URLSearchParams(location.search),before=params.get('snapshot')==='20261104h';
const {makeAquaticModels}=await import(/* @vite-ignore */ before?'/.playwright-mcp/modeling-20261104h/baseline-creatures.ts':'/src/scene/PondCreatures.ts');
const asset=params.get('asset')||'frog',view=params.get('view')||'oblique',pose=params.get('pose')||'rest',surface=params.get('surface')||'material',animals=makeAquaticModels(params.get('quality')==='low');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dce3d8');scene.add(new T.HemisphereLight('#e4f3f5','#6c7654',1.45));const light=new T.DirectionalLight('#fff1cf',2.6);light.position.set(-3,7,-4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-1.5;light.shadow.camera.right=1.5;light.shadow.camera.top=1.5;light.shadow.camera.bottom=-1.5;light.shadow.normalBias=.001;scene.add(light);
const model=asset==='frog'?animals.frog:animals.turtles[0];scene.add(model.root);const p={x:0,y:0,z:0,yaw:0,pitch:0,speed:pose==='swim'?.2:0,gait:1.15,mode:asset==='frog'?(pose==='swim'?'swim':pose==='jump'?'jump':'rest'):(pose==='swim'?'swim':'bask'),jump:.35,padIndex:0};
if(pose==='swim')p.y=-.13;model.update(p,0);
if(asset==='turtle'&&pose==='ride'){const young=animals.turtles[1];scene.add(young.root);young.update({...p,y:.35,mode:'ride'},0)}
const floor=new T.Mesh(new T.PlaneGeometry(50,50),new T.ShadowMaterial({color:'#455147',opacity:.19}));floor.rotation.x=-Math.PI/2;floor.position.y=.006;floor.receiveShadow=true;floor.visible=pose==='rest'||pose==='ride';scene.add(floor);
if(surface==='gray')model.root.traverse(o=>{if(o.isMesh)o.material=new T.MeshStandardMaterial({color:'#acb5a6',roughness:.70,side:T.DoubleSide})});
const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100),controls=new OrbitControls(camera,renderer.domElement),centre=new T.Vector3(0,asset==='frog'?.20:.20,asset==='frog'?-.015:-.10);if(pose==='swim')centre.y-=.13;
const directions={oblique:[1.15,.85,-1.65],front:[0,.35,-1.9],side:[1.9,.35,-.12],top:[.001,1.9,-.001]};const offset=new T.Vector3(...directions[view]).multiplyScalar(asset==='frog'?.90:1.40);camera.position.copy(centre).add(offset);controls.target.copy(centre);controls.update();const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);render();
for(const id of ['asset','view','pose','surface']){document.getElementById(id).value={asset,view,pose,surface}[id];document.getElementById(id).onchange=e=>{params.set(id,e.target.value);location.search=params.toString()}}
document.querySelector('#status').textContent=(before?'修改前':'当前模型')+' · '+asset+' · '+pose;
window.pondReview={scene,camera,controls,renderer,animals,model,pose:p,render};document.body.dataset.ready='true';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});
</script></body></html>
