<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pond · 生物近景</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#cbd9cf;color:#354e43;font:13px system-ui}canvas{display:block}header{position:fixed;inset:18px 22px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header>div,button,select,a{background:#f7f3e8ee;border:1px solid #bbcab9;padding:9px 13px;border-radius:7px;color:inherit}p{margin:4px 0 0;font-size:11px;color:#738074}#status{position:fixed;bottom:18px;left:22px;background:#f7f3e8dc;padding:10px;border-radius:6px;max-width:90vw}
</style></head><body><header><div>池塘生物 · 实际模型与行为<p>拖动旋转、滚轮缩放；此制作审阅页不进入发布包</p></div><select aria-label="观察对象"><option value="habitat">乌龟、青蛙与荷花</option><option value="koi">锦鲤近景</option><option value="turtle">大小乌龟近景</option><option value="frog">青蛙近景</option><option value="swan">天鹅起飞与落水</option></select><button id="pause">暂停</button><button id="step">推进 1 秒</button><button id="advance">推进 20 秒</button><a href="scene-review.html?freeze=0">实景</a><a href="/">回到池塘</a></header><div id="status"></div><script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makePondWildlife } from '/src/scene/PondWildlife.ts';
import { SwanLife, dragonflyVisits } from '/src/scene/wildlife-life.ts';
const reviewParams=new URLSearchParams(location.search),before=reviewParams.get('snapshot')==='before';
const {makeAquaticModels}=await import(before?'/.playwright-mcp/modeling-20261104f/baseline-creatures.ts':'/src/scene/PondCreatures.ts');
const {makePondHabitat,makePairHearts}=await import(before?'/.playwright-mcp/modeling-20261104f/baseline-habitat.ts':'/src/scene/PondHabitat.ts');
import {animalIsland,lilyPads,padSurfaceHeight} from '/src/scene/habitat-layout.ts';
import { HabitatLife } from '/src/scene/habitat-life.ts';
import { FishSchool,RippleField,sampleSurface } from '/src/scene/pond-life.ts';
import { fishObstacles,koiObstacles,boatStart } from '/src/scene/world-layout.ts';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#cbd9cf');scene.add(new T.HemisphereLight('#e4f3f5','#6c7654',1.45));const light=new T.DirectionalLight('#fff1cf',2.6);light.position.set(-3,7,4);scene.add(light);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,200),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const low=reviewParams.get('quality')==='low';
const idx=reviewParams.has('fish')?Math.max(0,Math.min(6,Number(reviewParams.get('fish'))|0)):-1;
const animals=makeAquaticModels(low),habitat=makePondHabitat(low),hearts=makePairHearts(),life=new HabitatLife(9127),fish=new FishSchool(7,81,before?fishObstacles:koiObstacles),ripples=new RippleField();
const wildlife=makePondWildlife(),swan=new SwanLife();
scene.add(animals.group,habitat.group,hearts.group,wildlife.group);
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#9cae99',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.35;scene.add(floor);
const water=new T.Mesh(new T.PlaneGeometry(21.6,17.4),new T.MeshStandardMaterial({color:'#85b3a7',roughness:.44}));
water.rotation.x=-Math.PI/2;water.position.z=-.55;scene.add(water);
const select=document.querySelector('select'),pause=document.querySelector('#pause'),status=document.querySelector('#status');
let frame=0,time=0,accumulator=0,paused=reviewParams.has('paused'),mode='habitat',last=performance.now();
const padSupport=habitat.padSupport??(i=>{const pad=lilyPads[i];return {...pad,height:padSurfaceHeight(sampleSurface(pad.x,pad.z,time).height),dx:0,dz:0}});
function simulate(){const dt=1/60;time=++frame*dt;life.update(dt,time,ripples,boatStart);fish.update(dt,time,ripples,boatStart);swan.update(dt,time,ripples,0,boatStart,sampleSurface)}
function advance(seconds){for(let n=0;n<Math.round(seconds*60);n++)simulate()}
advance(Math.max(0,Math.min(300,Number(reviewParams.get('time')??(reviewParams.get('view')==='swan'?24:40)))));
if(paused)pause.textContent='继续';
if(reviewParams.get('surface')==='gray')scene.traverse(o=>{if(o.isMesh)o.material=new T.MeshStandardMaterial({color:'#a5b5aa',roughness:.72,side:T.DoubleSide});});
const offsets={habitat:[4,6.6,7],koi:idx<0?[1.2,2.3,2.5]:[1.18,.76,1.22],turtle:[1.7,1.3,1.9],frog:[1.2,1.1,1.6],swan:[2.65,1.85,3.05]};
const center=new T.Vector3(),shift=new T.Vector3();
function aim(){
  const subject=mode==='frog'?life.frog:mode==='turtle'?life.turtles[0]:mode==='swan'?swan.pose:mode==='koi'?fish.poses[idx]:null;
  if(subject)return center.set(subject.x,subject.y+(mode==='swan'?.36:.025),subject.z);
  if(mode==='koi'){const [a,b]=fish.poses;return center.set((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);}
  return center.set(animalIsland.x-.25,.1,animalIsland.z+.75);
}
function focus(value){
  mode=Object.hasOwn(offsets,value)?value:'habitat';select.value=mode;
  habitat.group.visible=floor.visible=mode==='habitat'||mode==='swan';water.visible=wildlife.group.visible=mode==='swan';
  hearts.group.visible=mode==='koi'&&idx<0;
  animals.koi.forEach((k,i)=>{k.root.visible=mode==='koi'&&(idx<0||i===idx)});
  animals.turtles.forEach(k=>k.root.visible=mode==='habitat'||mode==='turtle');
  animals.frog.root.visible=mode==='habitat'||mode==='frog';animals.tadpoles.forEach(k=>k.root.visible=mode==='habitat'||mode==='frog');
  controls.target.copy(aim());camera.position.set(...offsets[mode]).add(controls.target);controls.update();
}
select.onchange=e=>focus(e.target.value);
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续':'暂停'};
document.querySelector('#step').onclick=()=>advance(1);
document.querySelector('#advance').onclick=()=>advance(20);
focus(reviewParams.get('view'));
const swanMode={glide:'游弋',rest:'休息',turn:'划水转向',takeoff:'蹬水起飞',flight:'拍翼／滑翔',land:'下降／滑水'};
let lastDrawn=-1;
renderer.setAnimationLoop(()=>{
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){accumulator+=dt;while(accumulator>=1/60){simulate();accumulator-=1/60;}}
  if(frame!==lastDrawn){
    const p=life.frog;
    animals.koi.forEach((k,i)=>k.update(fish.poses[i],time));animals.turtles.forEach((m,i)=>m.update(life.turtles[i],time,habitat.ground));
    animals.frog.update(p,time);animals.tadpoles.forEach((m,i)=>m.update(life.tadpoles[i],time));habitat.update(time,p.mode==='rest'?p.padIndex:-1);
    wildlife.update(swan,time,1/60,0,sampleSurface,padSupport);
    lastDrawn=frame;
  }
  aim();camera.position.add(shift.subVectors(center,controls.target));controls.target.copy(center);
  controls.update();hearts.update(fish.hearts,time,camera.quaternion);renderer.render(scene,camera);
  status.textContent=`${before?'旧模型 · ':''}${time.toFixed(1)} 秒 · `+(mode==='swan'?`天鹅 ${swanMode[swan.pose.mode]} · 完成 ${swan.flights} 次飞行`:
    mode==='koi'&&idx>=0?`锦鲤 ${idx+1} · 水深 ${Math.max(0,-fish.poses[idx].y).toFixed(2)} m`:
    `乌龟 ${life.turtles.map(t=>t.mode).join(' / ')} · 青蛙 ${life.frog.mode} · 上岸 ${life.events.landings} · 骑背 ${life.events.rides} · 跳跃 ${life.events.frogJumps}`);
});
window.pondReview={scene,camera,controls,animals,habitat,life,fish,swan,wildlife,renderer,advance};document.body.dataset.ready='true';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
