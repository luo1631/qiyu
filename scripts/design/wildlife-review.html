<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Pond · 天鹅与蜻蜓</title><style>body{margin:0;background:#dce3d8;color:#354e43;font:13px system-ui}canvas{display:block}header{position:fixed;inset:18px 22px auto;display:flex;gap:12px;align-items:center}header>*{background:#f7f3e8ee;border:1px solid #bbcab9;padding:10px 14px;border-radius:7px;color:inherit}#status{position:fixed;bottom:18px;left:22px}</style></head><body><header><span>天鹅与蜻蜓 · 实际模型 · 拖动旋转</span><select id="asset"><option value="swan">天鹅</option><option value="dragonfly">蜻蜓</option></select><select id="view"><option value="oblique">斜前方</option><option value="side">侧面</option><option value="front">正面</option><option value="top">俯视</option></select><a href="scene-review.html?freeze=0">实际荷塘</a><a href="/">主页</a></header><div id="status"></div><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {makePondWildlife} from '/src/scene/PondWildlife.ts';
const q=new URLSearchParams(location.search),asset=q.get('asset')||'swan',view=q.get('view')||'oblique';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dce3d8');scene.add(new T.HemisphereLight('#e4f3f5','#6c7654',1.45));const light=new T.DirectionalLight('#fff1cf',2.6);light.position.set(-3,7,-4);scene.add(light);
const wildlife=makePondWildlife(),model=asset==='swan'?wildlife.swan:wildlife.insects[0].root;scene.add(model);
const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,100),controls=new OrbitControls(camera,renderer.domElement),centre=new T.Vector3(0,asset==='swan'?.46:0,-.02);
const directions={oblique:[2.1,1.65,-3.0],front:[0,.65,-3.4],side:[3.4,.65,-.05],top:[.001,3.4,.001]};camera.position.copy(centre).add(new T.Vector3(...directions[view]).multiplyScalar(asset==='swan'?1:.20));controls.target.copy(centre);controls.update();
const render=()=>renderer.render(scene,camera);controls.addEventListener('change',render);render();
for(const id of ['asset','view']){document.getElementById(id).value={asset,view}[id];document.getElementById(id).onchange=e=>{q.set(id,e.target.value);location.search=q.toString()}}
document.querySelector('#status').textContent=asset==='swan'?'Three.js 天鹅 · 连续颈部与分层羽翼 · 水线在 y=0':'三只不同体色 · 半透翼膜、浅色翼缘与翅痣';
window.wildlifeReview={scene,camera,controls,renderer,wildlife,model,render};document.body.dataset.ready='true';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()});
</script></body></html>
